services:
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: midnight-proof-server
    ports:
      - "6300:6300"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6300/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-app:
    build:
      context: .
      dockerfile: app/Dockerfile.app
    container_name: midnight-dni-webapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MIDNIGHT_NETWORK=testnet
      - NEXT_PUBLIC_VOTING_CONTRACT_ADDRESS=8ac29e39f6ac3de1dd63db8b9d9c5eed8efd407e900901987b32418e9f51457e
      - NEXT_PUBLIC_DNI_CONTRACT_ADDRESS=0a397d25eb5779f68fb3685756006d332077185d956bd652d248b00519c8ba10
      - VOTING_CONTRACT_ADDRESS=8ac29e39f6ac3de1dd63db8b9d9c5eed8efd407e900901987b32418e9f51457e
      - DNI_CONTRACT_ADDRESS=0a397d25eb5779f68fb3685756006d332077185d956bd652d248b00519c8ba10
      - NEXT_PUBLIC_PROOF_SERVER_URL=http://localhost:6300
      - MIDNIGHT_PROOF_SERVER_URL=http://proof-server:6300
    depends_on:
      proof-server:
        condition: service_started
    restart: unless-stopped
