services:
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: midnight-proof-server
    ports:
      - "6300:6300"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6300/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-app:
    build:
      context: .
      dockerfile: app/Dockerfile.app
    container_name: midnight-dni-webapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MIDNIGHT_NETWORK=testnet
      - NEXT_PUBLIC_VOTING_CONTRACT_ADDRESS=b62807c1734098303d0e86e47ae1ef04c4481b397d63782ea78a5c2874e7aeef
      - NEXT_PUBLIC_DNI_CONTRACT_ADDRESS=8ccc6bf37e02cfdbfa330c49288f23d894fe95f8bf42a62dd3d29709b4d75332
      - VOTING_CONTRACT_ADDRESS=b62807c1734098303d0e86e47ae1ef04c4481b397d63782ea78a5c2874e7aeef
      - DNI_CONTRACT_ADDRESS=8ccc6bf37e02cfdbfa330c49288f23d894fe95f8bf42a62dd3d29709b4d75332
      - NEXT_PUBLIC_PROOF_SERVER_URL=http://localhost:6300
      - MIDNIGHT_PROOF_SERVER_URL=http://proof-server:6300
    depends_on:
      proof-server:
        condition: service_started
    restart: unless-stopped
